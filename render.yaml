services:
  - type: web
    name: complaint-backend
    env: docker
    rootDir: backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: complaint-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: complaint-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: complaint-db
          property: password

databases:
  - name: complaint-db
    plan: free
    databaseName: complaintdb
