spring.application.name=complaint-management-system

# Server Port
server.port=8080

# Database Configuration
# Use H2 for local development, PostgreSQL for production
spring.profiles.active=default

# H2 Database (Local Development)
spring.datasource.url=jdbc:h2:mem:complaintdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=mySecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Application Info
app.name=Smart Complaint Management System
app.description=Gram Panchayat Waregaon Complaint Management System
